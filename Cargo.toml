[package]
name = "deskctl"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
atspi = { version = "0.30", features = ["zbus"] }
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["process", "fs", "time", "event"] }
serde_json = "1.0.154"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.9.0", default-features = false }

[dev-dependencies]
png = "0.18"
